<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GOBLOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Nunito+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: one centred launch card on the GOBLOX dark shell; it forwards students to the real game on Apps Script */
:root{--bg:#232527;--surface:#2b2d30;--line:#4b4e52;--fg:#fff;--muted:#bcbec2;--green:#00a86b;--green-hi:#00c47d;--gold:#ffc23d;
  --f-display:'Montserrat','Arial Black',system-ui,sans-serif;--f-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body)}
body{display:grid;place-items:center;padding:24px 16px}
.card{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;text-align:center}
.logo{font-family:var(--f-display);font-weight:900;font-size:44px;display:flex;justify-content:center;align-items:center;gap:2px;letter-spacing:.02em}
.logo .o{display:inline-block;width:.72em;height:.72em;background:currentColor;transform:rotate(-14deg);margin:0 .07em;position:relative;top:.02em}
.logo .o::after{content:"G";position:absolute;inset:0;display:grid;place-items:center;color:var(--surface);font-size:.7em;line-height:1}
p{margin:0;color:var(--muted);line-height:1.5}
.play{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--green);color:#fff;text-decoration:none;font-family:var(--f-display);font-weight:900;font-size:22px;padding:16px;border-radius:12px}
.play:hover{background:var(--green-hi)}
.play:focus-visible,.alt a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.play svg{width:26px;height:26px}
.alt{display:flex;flex-direction:column;gap:6px;font-size:14px}
.alt a{color:var(--gold);font-weight:800}
.small{font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-label="GOBLOX">G<span class="o"></span>BLOX</div>
  <p>Practise real-life English in a blocky 3D world. Sign in with your <b>@iesgoya.es</b> Google account.</p>
  <a class="play" id="play" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></svg>Play GOBLOX</a>
  <p class="small" id="auto">Opening the game…</p>
  <div class="alt">
    <a id="guest" href="#" hidden>I'm a guest with an invite code</a>
    <a href="apps-script/index.html">Try the offline demo (nothing is saved)</a>
  </div>
</main>
<script>
/* ====== EDIT HERE ======
   GAME_URL: the Apps Script web app link (Implementar → Gestionar implementaciones), ending in /exec.
   GUEST_URL: optional second deployment for guests ("Cualquier usuario"). Leave '' to hide the button. */
const GAME_URL = 'https://script.google.com/a/macros/iesgoya.es/s/AKfycbygePIkFC1Y-xsYwlP24jPQXTTzpLSf-KsYneXyIACnJRgMvriCwBS78FZxbcbnw6ue/exec';
const GUEST_URL = '';
/* ======================= */
document.getElementById('play').href = GAME_URL;
if (GUEST_URL) { const g = document.getElementById('guest'); g.href = GUEST_URL; g.hidden = false; }
/* students go straight to the game; ?stay keeps this page open (e.g. for guests) */
if (!/[?&]stay\b/.test(location.search)) setTimeout(() => location.replace(GAME_URL), 1200);
else document.getElementById('auto').hidden = true;
</script>
</body>
</html>
